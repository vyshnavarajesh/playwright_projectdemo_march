name: Playwright SauceDemo Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: sanity
        type: choice
        options:
          - sanity
          - regression
          - all
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run selected test suite
        shell: bash
        run: |
          SUITE_INPUT="${{ github.event.inputs.suite }}"
          SUITE="${SUITE_INPUT:-all}"

          if [ "$SUITE" = "sanity" ]; then
            npm run test:sanity
          elif [ "$SUITE" = "regression" ]; then
            npm run test:regression
          else
            npm run test:all:saucedemo
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore